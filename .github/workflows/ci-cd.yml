name: CI/CD - Test, build, push to GHCR and deploy to OVH

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: raiseup-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API - build and tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc -p tsconfig.json
      - run: npm run build
      - run: npx jest --ci

  migrations:
    name: Database upgrade keeps existing data
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: raiseup }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/raiseup?schema=public
      PGPASSWORD: postgres
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - name: Previous version of the database, with data in it
        run: |
          mkdir -p /tmp/old/migrations
          cp prisma/migrations/migration_lock.toml /tmp/old/migrations/
          cp -r prisma/migrations/20251007125545_final_schema /tmp/old/migrations/
          cp prisma/schema.prisma /tmp/old/schema.prisma
          npx prisma migrate deploy --schema /tmp/old/schema.prisma
          psql -h localhost -U postgres -d raiseup -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO "User"(id,email,password,"fullName",role,"updatedAt") VALUES ('s','s@x.co','h','S','STARTUP',now()),('i','i@x.co','h','I','INVESTOR',now());
          INSERT INTO "StartupProfile"(id,"userId","companyName",industry,stage) VALUES ('sp','s','Acme','AI','MVP');
          INSERT INTO "Match"(id,"startupId","investorId",status) VALUES ('m','s','i','ACCEPTED');
          INSERT INTO "Message"(id,"matchId","senderId",content) VALUES ('msg','m','i','hello');
          SQL
      - name: Apply the new migration exactly like the container does
        run: npx prisma migrate deploy
      - name: Existing rows are still there
        run: |
          test "$(psql -h localhost -U postgres -d raiseup -tAc "select count(*) from \"Message\" where id='msg' and kind='TEXT'")" = "1"
          test "$(psql -h localhost -U postgres -d raiseup -tAc "select count(*) from \"StartupProfile\" where id='sp'")" = "1"
      - name: Migrations match schema.prisma exactly
        run: |
          psql -h localhost -U postgres -c 'create database shadow'
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://postgres:postgres@localhost:5432/shadow --exit-code

  client:
    name: Client - build and end-to-end tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: client } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: client/package-lock.json }
      - run: npm ci
      - run: npx ng build --configuration production
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env: { CI: 'true' }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: client/playwright-report, retention-days: 7 }

  images:
    name: Docker images
    needs: [api, migrations, client]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        include:
          - { name: server, context: ./server }
          - { name: client, context: ./client }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/anasserekysy/raiseup-${{ matrix.name }}:latest
            ghcr.io/anasserekysy/raiseup-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy to OVH
    needs: images
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy deployment files to the VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OVH_HOST }}
          username: ${{ secrets.OVH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: deploy/docker-compose.prod.yml,deploy/deploy.sh
          target: raiseup
          strip_components: 1
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CLIENT_BIND: ${{ vars.RAISEUP_CLIENT_BIND }}
        with:
          host: ${{ secrets.OVH_HOST }}
          username: ${{ secrets.OVH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,JWT_SECRET,CLIENT_BIND
          command_timeout: 15m
          script: |
            chmod +x ~/raiseup/deploy.sh
            ~/raiseup/deploy.sh
