# Site for the VM's reverse-proxy container (/opt/nginx/conf.d/raiseup.conf).
# Names are resolved per request through Docker's DNS, so redeploys never cause 502s.
# The Upgrade headers let live updates (WebSocket) through.

map $http_upgrade $raiseup_connection { default upgrade; '' close; }

server {
    listen 443 ssl;
    server_name raiseup.anasserekysy.com;

    ssl_certificate /etc/letsencrypt/live/anasserekysy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anasserekysy.com/privkey.pem;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $raiseup_client http://raiseup-client-1:80;

    location / {
        proxy_pass $raiseup_client;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $raiseup_connection;
        proxy_read_timeout 1h;
    }
}
