# Old API subdomains (api-raiseup / api.raiseup). The site no longer needs them, but they keep working:
# the client container forwards /api to the API, so the API stays off the shared network.
server {
    listen 443 ssl;
    server_name api-raiseup.anasserekysy.com api.raiseup.anasserekysy.com;

    ssl_certificate /etc/letsencrypt/live/anasserekysy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anasserekysy.com/privkey.pem;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $raiseup_client_api http://raiseup-client-1:80;

    location / {
        proxy_pass $raiseup_client_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $raiseup_connection;
    }
}
