# RaiseUp production stack on the OVH VM.
# Project, service and volume names match the previous setup, so the containers keep
# their names (raiseup-*-1) and the existing database volume (raiseup_investor_db_data) is reused.
name: raiseup

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - investor_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [investor_net]

  api:
    image: ghcr.io/anasserekysy/raiseup-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://raiseup.anasserekysy.com}
    depends_on:
      db:
        condition: service_healthy
    # Unique name on the stack's own network only (other stacks on "web" also have an "api").
    networks:
      investor_net:
        aliases: [raiseup-api]

  client:
    image: ghcr.io/anasserekysy/raiseup-client:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${CLIENT_BIND:-0.0.0.0}:3000:80"
    networks: [investor_net, web]

volumes:
  investor_db_data:

networks:
  investor_net:
  web:
    # Shared network of the VM's reverse-proxy container
    external: true
